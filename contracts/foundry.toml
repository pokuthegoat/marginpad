[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Compiler. Pinned so every machine and CI produce the same bytecode.
solc_version = "0.8.24"
# "paris" = no PUSH0 / MCOPY / transient storage. Robinhood Chain is an Arbitrum chain and its docs don't list
# opcode support, so this is the conservative choice that runs everywhere. Revisit (e.g. "cancun") once verified.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# The deploy script may write the deployed addresses to ./deployments/<chainId>.json, and nothing else.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

# `forge test --profile ci` for heavier runs.
[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 2000

# Named RPC endpoints, used as `--rpc-url anvil` / `--rpc-url robinhood_testnet`.
# The public testnet RPC is rate-limited (per Robinhood's docs); put a provider URL (Alchemy, QuickNode, ...) in
# ROBINHOOD_TESTNET_RPC_URL in contracts/.env and pass `--rpc-url $ROBINHOOD_TESTNET_RPC_URL` if you hit limits.
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
